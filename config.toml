baseURL = "https://dg.wr.io/"
theme = "hugo-theme-cleanwhite"
languageCode = "en-us"
theme = "hugo-theme-cleanwhite-master"
relativeURLs = true
disablePathToLower = true
ignoreFiles = [
    "/content/templates/*",
    "/content/private/*",
]
summaryLength = 20
paginate = 10
enableGitInfo = true

cd dg.wr.io
git submodule add https://github.com/hugo-fixit/hugo-theme-cleanwhite.git themes/hugo-theme-cleanwhite-master
git submodule update --init --recursive



[markup]
    [markup.tableOfContents]
        endLevel = 3
        ordered = true
        startLevel = 2
    [markup.highlight]
        noClasses = false
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ""
        lineAnchors = ""
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        style = "dracula"
    [frontmatter]
        lastmod = ["lastmod", ":git", "date", "publishDate"]
        publishDate = ["publishDate", "date"]
    [markup.goldmark.renderer]
        unsafe = true
